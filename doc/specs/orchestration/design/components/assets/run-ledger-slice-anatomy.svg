<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">

  <!-- Background -->
  <rect width="720" height="480" fill="#1a1a2e" rx="12"/>

  <!-- Title -->
  <text x="360" y="36" text-anchor="middle" fill="#e0e0e0" font-size="16" font-weight="bold" font-family="system-ui,sans-serif">Run-Ledger Slice — Anatomy</text>
  <text x="360" y="54" text-anchor="middle" fill="#888" font-size="11" font-family="system-ui,sans-serif">Derived from schemas/run-ledger.schema.json</text>

  <!-- Outer slice box -->
  <rect x="60" y="70" width="330" height="370" fill="#0d1b2a" stroke="#4a90d9" stroke-width="2" rx="8"/>
  <text x="225" y="95" text-anchor="middle" fill="#4a90d9" font-size="12" font-weight="bold">slice { }</text>

  <!-- Fields -->
  <!-- id -->
  <rect x="80" y="106" width="290" height="28" fill="#162032" rx="4"/>
  <text x="92" y="124" fill="#f0c040">id</text>
  <text x="140" y="124" fill="#888">string</text>
  <text x="210" y="124" fill="#e74c3c" font-size="11">required</text>
  <text x="270" y="124" fill="#aaa" font-size="11">unique within run</text>

  <!-- status -->
  <rect x="80" y="140" width="290" height="28" fill="#162032" rx="4"/>
  <text x="92" y="158" fill="#f0c040">status</text>
  <text x="150" y="158" fill="#888">enum</text>
  <text x="195" y="158" fill="#e74c3c" font-size="11">required</text>
  <text x="260" y="158" fill="#aaa" font-size="11">pending|in_progress|…</text>

  <!-- kind -->
  <rect x="80" y="174" width="290" height="28" fill="#162032" rx="4"/>
  <text x="92" y="192" fill="#f0c040">kind</text>
  <text x="140" y="192" fill="#888">enum</text>
  <text x="185" y="192" fill="#6cb" font-size="11">optional</text>
  <text x="250" y="192" fill="#aaa" font-size="11">impl|plan|design|…</text>

  <!-- desc -->
  <rect x="80" y="208" width="290" height="28" fill="#162032" rx="4"/>
  <text x="92" y="226" fill="#f0c040">desc</text>
  <text x="145" y="226" fill="#888">string</text>
  <text x="195" y="226" fill="#6cb" font-size="11">optional</text>
  <text x="250" y="226" fill="#aaa" font-size="11">human-readable label</text>

  <!-- wave -->
  <rect x="80" y="242" width="290" height="28" fill="#162032" rx="4"/>
  <text x="92" y="260" fill="#f0c040">wave</text>
  <text x="145" y="260" fill="#888">int|null</text>
  <text x="210" y="260" fill="#6cb" font-size="11">optional</text>
  <text x="265" y="260" fill="#aaa" font-size="11">fan-out ordering</text>

  <!-- blocked_by -->
  <rect x="80" y="276" width="290" height="28" fill="#162032" rx="4"/>
  <text x="92" y="294" fill="#f0c040">blocked_by</text>
  <text x="175" y="294" fill="#888">string[]</text>
  <text x="235" y="294" fill="#6cb" font-size="11">optional</text>
  <text x="290" y="294" fill="#aaa" font-size="11">dep ids</text>

  <!-- acceptance -->
  <rect x="80" y="310" width="290" height="28" fill="#162032" rx="4"/>
  <text x="92" y="328" fill="#f0c040">acceptance</text>
  <text x="178" y="328" fill="#888">string[]</text>
  <text x="238" y="328" fill="#6cb" font-size="11">optional</text>
  <text x="295" y="328" fill="#aaa" font-size="11">observable ACs</text>

  <!-- ticket -->
  <rect x="80" y="344" width="290" height="28" fill="#162032" rx="4"/>
  <text x="92" y="362" fill="#f0c040">ticket</text>
  <text x="145" y="362" fill="#888">string</text>
  <text x="195" y="362" fill="#6cb" font-size="11">optional</text>
  <text x="250" y="362" fill="#aaa" font-size="11">bare id, no .md suffix</text>

  <!-- covers_ac / decisions -->
  <rect x="80" y="378" width="290" height="28" fill="#162032" rx="4"/>
  <text x="92" y="396" fill="#f0c040">covers_ac</text>
  <text x="172" y="396" fill="#888">str|str[]</text>
  <text x="238" y="396" fill="#6cb" font-size="11">optional</text>
  <text x="295" y="396" fill="#aaa" font-size="11">AC<n> labels</text>

  <!-- Annotation panel -->
  <rect x="420" y="70" width="270" height="370" fill="#0d1b2a" stroke="#555" stroke-width="1.5" rx="8"/>
  <text x="555" y="95" text-anchor="middle" fill="#aaa" font-size="12" font-weight="bold" font-family="system-ui,sans-serif">Kind variants</text>

  <!-- kind rows -->
  <rect x="435" y="106" width="240" height="30" fill="#1e2f1e" rx="4"/>
  <text x="447" y="126" fill="#6cb" font-size="12" font-weight="bold">impl</text>
  <text x="490" y="126" fill="#aaa" font-size="11">Standard implementation work</text>

  <rect x="435" y="142" width="240" height="30" fill="#1e2231" rx="4"/>
  <text x="447" y="162" fill="#7cb" font-size="12" font-weight="bold">plan</text>
  <text x="490" y="162" fill="#aaa" font-size="11">Planning / decomposition</text>

  <rect x="435" y="178" width="240" height="30" fill="#1e2231" rx="4"/>
  <text x="447" y="198" fill="#7cb" font-size="12" font-weight="bold">design</text>
  <text x="497" y="198" fill="#aaa" font-size="11">Architecture / design</text>

  <rect x="435" y="214" width="240" height="30" fill="#1e2231" rx="4"/>
  <text x="447" y="234" fill="#7cb" font-size="12" font-weight="bold">diagnose</text>
  <text x="510" y="234" fill="#aaa" font-size="11">Root-cause investigation</text>

  <rect x="435" y="250" width="240" height="30" fill="#2d1e1e" rx="4"/>
  <text x="447" y="270" fill="#e88" font-size="12" font-weight="bold">fog</text>
  <text x="478" y="270" fill="#aaa" font-size="11">Open question — no ACs</text>

  <!-- Status flow mini-diagram -->
  <text x="555" y="310" text-anchor="middle" fill="#aaa" font-size="12" font-weight="bold" font-family="system-ui,sans-serif">Status flow</text>

  <rect x="490" y="320" width="80" height="24" fill="#2a2a0a" stroke="#cca" stroke-width="1" rx="4"/>
  <text x="530" y="336" text-anchor="middle" fill="#cca" font-size="11">pending</text>

  <text x="530" y="362" text-anchor="middle" fill="#888" font-size="18">↓</text>

  <rect x="475" y="368" width="110" height="24" fill="#0a2a2a" stroke="#4af" stroke-width="1" rx="4"/>
  <text x="530" y="384" text-anchor="middle" fill="#4af" font-size="11">in_progress</text>

  <text x="530" y="410" text-anchor="middle" fill="#888" font-size="18">↓</text>

  <rect x="490" y="416" width="80" height="24" fill="#0a2a0a" stroke="#4a4" stroke-width="1" rx="4"/>
  <text x="530" y="432" text-anchor="middle" fill="#4a4" font-size="11">complete ✓</text>

  <!-- Connector lines from slice box to annotation panel -->
  <line x1="370" y1="185" x2="420" y2="262" stroke="#6cb" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  <text x="392" y="230" fill="#6cb" font-size="10" opacity="0.8">kind →</text>

</svg>
