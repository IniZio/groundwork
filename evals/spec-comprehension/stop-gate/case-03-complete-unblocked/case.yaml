schema_version: "1.0"
name: complete-never-blocked

execution:
  system: "Answer the question using ONLY the spec content provided in the user message. Do not use outside knowledge or search the codebase."

  prompt: |
    The following is the complete spec content you must use to answer the question below. Do not use any other knowledge.

    --- SPEC CONTENT (D-15): doc/specs/enforcement/requirements/pacing-r-003-ledger-complete-never-blocked-by-pacing.md ---
    id: pacing-r-003
    title: "`ledger complete` is never blocked by pacing"
    criticality: must
    verification: unverified
    source: groundwork-development#D-28

    ## Statement

    When `ledger complete` is invoked for any slice, the ledger CLI **shall** record the completion without restriction, regardless of pacing state or budget exhaustion.

    ## Why

    Refusing to record finished work would be a lie in the ledger (violates P-B). A slice that is genuinely done must be recorded as complete regardless of whether the session has exceeded its pace budget; blocking `complete` would strand the audit trail and prevent the advisor gate from reading accurate state. Pacing blocks *starting* new units of work; it never reverses or suppresses work that already happened. Pacing gates *starting* units of work via `claim` and `set --status in_progress` only; `add` and `complete` are deliberately ungated (P-B: refusing to record finished work would falsify the ledger).

    ## Fit criterion

    With pacing budget exhausted (`resolved_units >= budget + grant.range`), invoking `ledger complete <id>` for any slice exits 0 and sets that slice's status to `complete` in the ledger.

    ## Verification procedure

    Automated — with pacing budget exhausted, invoke `ledger complete <id>` and confirm exit 0 and the slice's status reads `complete`.
    --- END SPEC CONTENT ---

    QUESTION: Based only on the spec content above, is `ledger complete` ever blocked by pacing, even when the pacing budget is exhausted? What is the stated reason for this design choice? Cite the requirement ID in your answer.

graders:
  - name: check-complete-unblocked
    type: llm
    criteria: |
      The response must correctly state ALL of the following (citing PACING-R-003):
      1. ledger complete is NEVER blocked by pacing — not even when the budget is exhausted
      2. The reason: blocking complete would falsify the ledger (recording finished work as incomplete) or equivalent statement about auditability/truth of the ledger
      Score PASS only if both elements are stated correctly and PACING-R-003 is cited.
